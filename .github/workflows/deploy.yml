name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Token 在 Settings → Secrets and variables → Actions 里加 VITE_CLOUD_PROXY_TOKEN
      # （与 Cloudflare Worker 的 PROXY_TOKEN 相同；未配置时线上写接口会 401）
      # 仍可读旧名 VITE_JEV_PROXY_TOKEN，便于过渡
      - run: npm run build
        env:
          VITE_CLOUD_PROXY_URL: https://hantao-jiajia.cn
          VITE_CLOUD_PROXY_TOKEN: ${{ secrets.VITE_CLOUD_PROXY_TOKEN || secrets.VITE_JEV_PROXY_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
