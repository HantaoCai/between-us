name = "dry-term-0bf5"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

# 钉照片返回的公开 URL（不要用 workers.dev，国内常空白）
[vars]
PUBLIC_ORIGIN = "https://hantao-jiajia.cn"

routes = [
  { pattern = "hantao-jiajia.cn", custom_domain = true },
  { pattern = "www.hantao-jiajia.cn", custom_domain = true },
]

# 前端 dist 与 API 同域：API 路由先走 Worker，其余回落静态站
[assets]
directory = "../../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/health",
  "/jev",
  "/edit/*",
  "/media/*",
  "/stats",
  "/stats/*",
  "/peer/*",
]

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "between-us-media"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomBroker"

[[durable_objects.bindings]]
name = "ROOM_DIR"
class_name = "RoomDirectory"

[[migrations]]
tag = "v1-rooms"
new_sqlite_classes = ["RoomBroker"]

[[migrations]]
tag = "v2-room-dir"
new_sqlite_classes = ["RoomDirectory"]
